<div class="app-shell">
  <!-- ================= HEADER ================= -->

  <header class="header">
    <div class="header-inner">
      <!-- Logo -->

      <a routerLink="/recipes" class="logo">
        <div class="logo-icon">🍳</div>

        <div class="logo-text">
          <span class="logo-title">RecipeHub</span>
          <span class="logo-subtitle">Recipe Management</span>
        </div>
      </a>

      <!-- Navigation -->

      <nav class="navigation">
        <a
          routerLink="/recipes"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          <span>🏠</span>
          Recipes
        </a>

        <a routerLink="/recipes/add" routerLinkActive="active" class="nav-link">
          <span>➕</span>
          Add Recipe
        </a>
      </nav>

      <!-- Header Action -->

      <a routerLink="/recipes/add" class="header-button"> + New Recipe </a>
    </div>
  </header>

  <!-- ================= MAIN ================= -->

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- ================= FOOTER ================= -->

  <footer class="footer">
    <div>© 2026 RecipeHub</div>

    <div>Angular 21 + NgRx</div>
  </footer>
</div>
